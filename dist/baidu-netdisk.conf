# ===================================================================
# 多 App 去广告 — Quantumult X 完整配置（手动复制粘贴用）
#
# ⚠️ 本文件含 [section] 标题，**不能**用于 QX「引用」，会报 Invalid Line [rewrite_local]。
#    要引用请用 AdBlock-All.snippet + AdBlock-Filter.snippet。
#
# 此文件由 build.js 从 apps/*.js 生成，请勿手动修改。
# ===================================================================

# -------------------------------------------------------------------
# [rewrite_local] 改写接口响应
# -------------------------------------------------------------------
[rewrite_local]

# ── 百度网盘去广告 ──
# 开屏广告素材（严浩翔/贺峻霖 PNG + 素材包 plane_v5.zip）。实测该路径下 32 个 URL 100% 是开屏素材；注意同域的搜索图标也用 /febos/staticsns/amis/ 前缀，无法用路径区分（该图标在 973 条抓包中出现 0 次，代价可接受，见 tests）
^https?:\/\/(?:[^/]*\.)?s0-ant\.baidu\.com(?::\d+)?\/febos\/(?:[^/]*\/)* url reject
# 开屏素材的 CDN 代理路径 /e/（主机带 :19001 端口）。⚠️ 绝不能拦该域名的 /b/ 路径 —— 那是 App 渲染引擎 render_resourcd.zip(242MB)，拦了会破坏预览功能
^https?:\/\/[^/]*antpcdn\.com(?::\d+)?\/e\/[^/]+\/(?:[^/]*\/)* url reject

# -------------------------------------------------------------------
# [filter_local] 域名拦截（DNS 层 reject，不需要 MITM）
# -------------------------------------------------------------------
[filter_local]

# 百度自有广告框架（AFD）：广告决策入口与上报
host, afd.baidu.com, reject
host, mobads.baidu.com, reject
host, mobads-logs.baidu.com, reject

# 广告聚合 / 竞价平台（「摇一摇跳京东」的决策链路）
host, api-v3.mentamob.com, reject
host, api-nxs-v4.mentamob.com, reject
host, bid-adx2.vlion.cn, reject
host, bj-td-menta-01-callback.advlion.com, reject
host, adx-cfg-u1.ubixioe.com, reject

# 第三方广告素材与联盟
host, p1-lm.adukwai.com, reject
host, tstatic.66mobi.com, reject
host, im-x.jd.com, reject
host, ssdkauth.hpplay.cn, reject
host, mobads-pre-config.cdn.bcebos.com, reject

# 广告归因 SDK（AppLovin）
host, 1qojio.skadsdkless.appsflyersdk.com, reject
host, 1qojio.launches.appsflyersdk.com, reject
host, 1qojio.inapps.appsflyersdk.com, reject

# -------------------------------------------------------------------
# [mitm] 需要解密的主机名（追加到已有 hostname，不要覆盖）
# -------------------------------------------------------------------
[mitm]

hostname = pan.baidu.com

