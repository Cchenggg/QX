# ===================================================================
# 两步路 (lolaage.2bulu.zhushou) 去广告 — Quantumult X 配置片段
#
# 抓包依据：2026-10-15 HAR（App iOS 9.2.7）
# Android 侧请用本仓库另一套方案（LSPosed 模块）
#
# 把下面三段分别粘到你 QX 配置文件（设置 → 配置文件 → 编辑）
# 对应的 section 里；也可以整体存成 .conf 用「重写 → 引用」加载。
#
# 脚本走 GitHub raw 直链，QX 会自动同步更新，无需手动传文件。
# ===================================================================


# -------------------------------------------------------------------
# [rewrite_local]  —— 改写两步路自家接口
#
# 这些接口响应是明文 JSON 且无响应体签名，可以安全改写。
# -------------------------------------------------------------------
[rewrite_local]

# 每条规则末尾都带 [/?] 边界，避免误伤同前缀的其它接口。
# 例：不加边界时 /getSplash 会误匹配 /getSplashFrequencyStatistics。
# 这里用 [/\\?] 这种字符类写法而不是裸 ?，避免被当成正则量词。

# 广告总开关：关闭开屏广告 + 插屏/弹窗广告（最关键的一条）
^https?:\/\/helper\.2bulu\.com\/adConfig\/get[/?] url script-response-body https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js

# 开屏广告（冷启动 + 热启动二次开屏）
^https?:\/\/helper\.2bulu\.com\/getSplash[/?] url script-response-body https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js

# 通用广告位 / 广告位汇总 / 弹窗商品位
^https?:\/\/helper\.2bulu\.com\/v9\/advert\/getUniversalAd[/?] url script-response-body https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js
^https?:\/\/helper\.2bulu\.com\/advert\/getAllAdInfo[/?] url script-response-body https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js
^https?:\/\/helper\.2bulu\.com\/getPopInfo[/?] url script-response-body https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js

# 首页信息流：移除 "A<数字>" 推广位
# （抓包中这些推广位排在最前面，一不小心就点进有赞商城/第三方 App）
^https?:\/\/helper\.2bulu\.com\/v9\/home\/feed[/?] url script-response-body https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js


# -------------------------------------------------------------------
# [filter_local]  —— 网络层拦截广告联盟域名
#
# 这是「开屏/弹窗跳转第三方 App」的根治办法：
# 广告素材由第三方联盟 SDK 下发，把域名 reject 掉，SDK 就永远拿不到
# 可跳转的素材。
#
# host reject 是 DNS 层拦截（QX 对该域名返回 127.0.0.1），
# 不需要 MITM、也不用把域名加进 hostname，速度快且绕不过去。
# -------------------------------------------------------------------
[filter_local]

# —— 开屏/插屏广告素材与投放（最关键：快手联盟，抓包里的创意图来源）——
host, p66-ad.adkwai.com, reject

# —— 穿山甲 / 字节 GroMore ——
host, api-access.pangolin-sdk-toutiao.com, reject
host, api-access.pangolin-sdk-toutiao1.com, reject
host, log-api.pangolin-sdk-toutiao.com, reject
host, gromore.pangolin-sdk-toutiao.com, reject
host, sf3-fe-tos.pglstatp-toutiao.com, reject

# —— 广告聚合 / 竞价平台 ——
host, sdk.adx.adwangmai.com, reject
host, sdk-cfg.adx.adwangmai.com, reject
host, api-htp.beizi.biz, reject
host, sdk.beizi.biz, reject
host, sdkg.fancyapi.com, reject
host, t2.fancyapi.com, reject
host, static.fancyapi.com, reject
host, lftxali.fancyapi.com, reject
host, mpcfg.fancydsp.com, reject
host, entry-su1.ubixioe.com, reject
host, adx-cfg-u1.ubixioe.com, reject
host, sdk.1rtb.net, reject
host, s.tuia.cn, reject
host, sdk-track.66mobi.com, reject
host, tstatic.66mobi.com, reject
host, sdk.zhangyuyidong.cn, reject
host, sdklog.zhangyuyidong.cn, reject
host, de.ad.gameley.com, reject
host, jp.ad.gameley.com, reject

# —— 其他联盟 ——
host, mi.gdt.qq.com, reject
host, v2mi.gdt.qq.com, reject
host, adsmartget.guangtuikeji.com, reject
host, report2.dhsz.cn, reject
host, im-x.jd.com, reject
host, api.ocpx.ydmob.com, reject

# 注：sdk.e.qq.com / tk.anythinktech.com / ujoy.anythinktech.com /
#     adx-bj.anythinktech.com / da.statisticslinks.com 多为 SDK 上报接口，
#     拦不拦都不影响去广告效果，故默认放行，少拦一点更稳。


# -------------------------------------------------------------------
# [mitm]  —— 只有两步路自家接口需要解密
#
# 第三方广告域名走 filter 的 DNS 层 reject，不进 MITM，
# 所以这里只留两步路的接口域名，范围最小、最安全。
# -------------------------------------------------------------------
[mitm]

hostname = helper.2bulu.com, utility.2bulu.com
