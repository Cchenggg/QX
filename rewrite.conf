# -------------------------------------------------------------------
# [mitm]  —— 需要解密的主机名
#
# 只有需要改写响应体的域名才要加进来。
# 走 filter reject 的域名不需要 MITM。
# -------------------------------------------------------------------
[mitm]

# ── 两步路去广告 ──
hostname = helper.2bulu.com, utility.2bulu.com
