# ===================================================================
# 两步路 (lolaage.2bulu.zhushou) 去广告 — Quantumult X 配置
#
# 抓包依据：2026-10-15 HAR（App iOS 9.2.7）
# 详细操作说明见 README.md
#
# 【怎么用】三选一：
#   A. 追加模式：把 [rewrite_local] / [filter_local] 内容追加到你的
#      QX 配置文件对应 section，[mitm] 的 hostname 追加进去。
#   B. 引用模式（推荐）：QX → 设置 → 重写 → 引用，添加本文件地址：
#      https://gh-proxy.com/https://raw.githubusercontent.com/Cchenggg/QX/main/rewrite.conf
#
# 【脚本地址说明】
#   下面所有规则统一用 gh-proxy.com 前缀代理。实测：
#     raw.githubusercontent.com 直连 000/000/200 极不稳定（15s 超时）
#     gh-proxy.com 直连 200/200/200，0.7~1.3s，内容与仓库一致
#   若你确定 QX 里 GitHub 走代理，可全局替换为 raw 地址：
#     把 https://gh-proxy.com/https://raw.githubusercontent.com/Cchenggg/QX/main/
#     替换成 https://raw.githubusercontent.com/Cchenggg/QX/main/
#   已实测可用的等价替代前缀（内容一致）：
#     https://ghfast.top/        或   https://cdn.jsdelivr.net/gh/Cchenggg/QX@main/
# ===================================================================


# -------------------------------------------------------------------
# [rewrite_local]  —— 改写接口响应
#
# 规则写法要点：
#   1. 末尾加 [/?] 边界，避免前缀误伤
#      例：不加边界时 /getSplash 会误命中 /getSplashFrequencyStatistics
#   2. 用 [/\\?] 字符类，不要写裸 ?，否则会被当成正则量词
# -------------------------------------------------------------------
[rewrite_local]

# ── 两步路去广告（tbulu-ads.js）────────────────────────────────
# 广告总开关：关闭开屏广告 + 插屏/弹窗广告（最关键的一条）
^https?:\/\/helper\.2bulu\.com\/adConfig\/get[/?] url script-response-body https://gh-proxy.com/https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js

# 开屏广告（冷启动 + 热启动二次开屏）
^https?:\/\/helper\.2bulu\.com\/getSplash[/?] url script-response-body https://gh-proxy.com/https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js

# 通用广告位 / 广告位汇总 / 弹窗商品位
^https?:\/\/helper\.2bulu\.com\/v9\/advert\/getUniversalAd[/?] url script-response-body https://gh-proxy.com/https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js
^https?:\/\/helper\.2bulu\.com\/advert\/getAllAdInfo[/?] url script-response-body https://gh-proxy.com/https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js
^https?:\/\/helper\.2bulu\.com\/getPopInfo[/?] url script-response-body https://gh-proxy.com/https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js

# 首页信息流：移除 "A<数字>" 推广位
# （抓包中这些推广位排在最前面，一不小心就点进有赞商城/第三方 App）
^https?:\/\/helper\.2bulu\.com\/v9\/home\/feed[/?] url script-response-body https://gh-proxy.com/https://raw.githubusercontent.com/Cchenggg/QX/main/tbulu-ads.js


# -------------------------------------------------------------------
# [filter_local]  —— 域名拦截
#
# host reject 是 DNS 层拦截（QX 对该域名返回 127.0.0.1），
# 不需要 MITM、也不用写进 hostname，是拦截广告最省事的方式。
# -------------------------------------------------------------------
[filter_local]

